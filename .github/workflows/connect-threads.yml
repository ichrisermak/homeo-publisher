name: Connect Threads

# Запускается вручную: Actions → Connect Threads → Run workflow
# account — какой аккаунт подключаем, code — код из адресной строки после «Разрешить»
on:
  workflow_dispatch:
    inputs:
      account:
        description: "Аккаунт"
        required: true
        type: choice
        options: [anna, prosto]
      code:
        description: "Код из адресной строки (всё после code=)"
        required: true
        type: string

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Exchange code for token
        env:
          ACCOUNT: ${{ inputs.account }}
          AUTH_CODE: ${{ inputs.code }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: node threads-auth.js
