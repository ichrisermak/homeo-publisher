name: VK Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check VK token (ничего не публикует)
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_OWNER_ID: ${{ secrets.VK_OWNER_ID }}
        run: |
          node <<'EOF'
          const t = process.env.VK_TOKEN, g = String(process.env.VK_OWNER_ID || "").replace("-", ""), ch = "235970731";
          const raw = async (m, p) => {
            const b = new URLSearchParams({ ...p, access_token: t, v: "5.199" });
            return (await fetch("https://api.vk.com/method/" + m, { method: "POST", body: b })).json();
          };
          (async () => {
            const r = await raw("messages.getConversationsById", { group_id: g, peer_ids: "-" + ch, extended: 1 });
            if (r.error) { console.log("❌", r.error.error_code, r.error.error_msg); return; }
            const c = r.response.items[0] || {};
            console.log("peer:", JSON.stringify(c.peer));
            console.log("can_write:", JSON.stringify(c.can_write));
            console.log("is_channel / тип:", JSON.stringify({ chat_settings: c.chat_settings ? Object.keys(c.chat_settings) : null, can_send_money: c.can_send_money, can_receive_money: c.can_receive_money }));
            const keys = Object.keys(c).join(", "); console.log("поля:", keys);
            const gr = (r.response.groups || []).map((x) => ({ id: x.id, name: x.name, type: x.type, is_admin: x.is_admin }));
            console.log("groups:", JSON.stringify(gr));
          })();
          EOF
