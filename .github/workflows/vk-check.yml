name: VK Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check VK token (ничего не публикует)
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_OWNER_ID: ${{ secrets.VK_OWNER_ID }}
        run: |
          node <<'EOF'
          const t = process.env.VK_TOKEN, g = String(process.env.VK_OWNER_ID || "").replace("-", ""), ch = "235970731";
          const raw = async (m, p) => {
            const b = new URLSearchParams({ ...p, access_token: t, v: "5.199" });
            return (await fetch("https://api.vk.com/method/" + m, { method: "POST", body: b })).json();
          };
          const show = (m, r) => console.log(m.padEnd(36), r.error ? "❌ " + r.error.error_code + " " + r.error.error_msg : "✅ " + JSON.stringify(r.response).slice(0, 400));
          (async () => {
            console.log("ключ задан:", !!t, "| сообщество:", g, "| канал:", ch);
            show("groups.getById (канал)", await raw("groups.getById", { group_ids: ch, fields: "type,is_admin,admin_level,activity,description" }));
            show("groups.getById (сообщество)", await raw("groups.getById", { group_ids: g, fields: "type" }));
            show("messages.getConversationsById", await raw("messages.getConversationsById", { group_id: g, peer_ids: "-" + ch }));
            show("wall.get канала (чтение)", await raw("wall.get", { owner_id: "-" + ch, count: 1 }));
          })();
          EOF
